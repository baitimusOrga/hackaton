# Frontend checks for pull requests that touch the frontend, on GitHub-hosted runners (no access to the homelab Docker host). Merge only
# when green; see ci-backend.yml. An API change reaches this workflow through frontend/openapi.json.
name: ci-frontend

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/ci-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: corepack enable   # pnpm at the packageManager version
      - run: pnpm install --frozen-lockfile
      - name: API client matches openapi.json
        run: pnpm run api && test -z "$(git status --porcelain -- src/app/api)" || { echo "::error::src/app/api is stale. Run pnpm run api and commit it."; exit 1; }
      - run: pnpm run format:check
      - run: pnpm exec ng lint
      - run: pnpm exec ng test --watch=false
      - run: pnpm exec ng build
