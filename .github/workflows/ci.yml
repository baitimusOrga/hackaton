# Checks for every pull request, on the homelab runners. Merge only when green (convention:
# the org is on GitHub Free, which has no branch protection for private repos).
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify (compile + tests on H2)
        run: ./mvnw -B -ntp verify
      - name: OpenAPI spec committed
        run: test -z "$(git status --porcelain -- ../frontend/openapi.json)" || { echo "::error::frontend/openapi.json is stale. Run ./mvnw verify in backend/ and pnpm run api in frontend/, then commit both."; exit 1; }

  frontend:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API client matches openapi.json
        run: pnpm run api && test -z "$(git status --porcelain -- src/app/api)" || { echo "::error::src/app/api is stale. Run pnpm run api and commit it."; exit 1; }
      - run: pnpm run format:check
      - run: pnpm exec ng lint
      - run: pnpm exec ng test --watch=false
      - run: pnpm exec ng build
