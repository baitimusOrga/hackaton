name: ci-auth

on:
  pull_request:
    paths:
      - auth/**
      - .github/workflows/ci-auth.yml
  workflow_dispatch:

concurrency:
  group: ci-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: auth
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        env:
          AUTH_TEST_DATABASE_URL: postgres://auth_test:ci-only-password@localhost:${{ job.services.postgres.ports[5432] }}/auth_test
