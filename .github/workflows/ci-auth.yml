name: ci-auth

on:
  pull_request:
    paths:
      - auth/**
      - .github/workflows/ci-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: corepack enable   # pnpm at the packageManager version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        env:
          AUTH_TEST_DATABASE_URL: postgres://auth_test:ci-only-password@localhost:5432/auth_test
