# Build and release through the homelab app platform (baitimusOrga/platform).
#   push to main  -> images :sha-<commit> + :staging, STAGING_* secrets/variables -> staging .env
#   tag v*        -> the same images become :prod + :<tag> (no rebuild), PROD_* -> prod .env
#   manual run    -> promote an existing tag to :prod (rollback) and/or re-sync one environment's .env
# Hosts pick everything up within a minute (deploy-sync). Compose files: baitimusOrga/deployments.
name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote:
        description: existing tag to put on :prod (rollback), e.g. v0.1.0. Empty = no image change
        required: false
        default: ""
      sync:
        description: write the .env of this environment from the repo secrets/variables
        type: choice
        options: [none, staging, prod]
        default: none

permissions:
  contents: read

# Pins: the reusable workflows are pinned to a commit SHA. To bump: resolve the new tag with
#   gh api repos/baitimusOrga/platform/git/matching-refs/tags/v1 --jq '.[].object.sha'
# review the diff in baitimusOrga/platform, then replace the SHA in all four `uses:` lines.
# `secrets: inherit` stays: env-sync reads the whole secrets context (toJSON(secrets)) and
# neither workflow declares on.workflow_call.secrets, so an explicit mapping is not possible.

jobs:
  auth:
    if: github.event_name != 'workflow_dispatch' || inputs.promote != ''
    uses: baitimusOrga/platform/.github/workflows/docker-app.yml@65c1373a14f8f498e9848c0df72498a704ffed93 # v1
    with:
      image: hackaton-auth
      context: auth
      dockerfile: auth/Dockerfile
      promote: ${{ inputs.promote || '' }}
    secrets: inherit

  backend:
    if: github.event_name != 'workflow_dispatch' || inputs.promote != ''
    uses: baitimusOrga/platform/.github/workflows/docker-app.yml@65c1373a14f8f498e9848c0df72498a704ffed93 # v1
    with:
      image: hackaton-backend
      context: backend
      dockerfile: backend/Dockerfile
      promote: ${{ inputs.promote || '' }}
    secrets: inherit

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.promote != ''
    uses: baitimusOrga/platform/.github/workflows/docker-app.yml@65c1373a14f8f498e9848c0df72498a704ffed93 # v1
    with:
      image: hackaton-frontend
      context: frontend
      dockerfile: frontend/Dockerfile
      promote: ${{ inputs.promote || '' }}
    secrets: inherit

  dotenv:
    if: github.event_name != 'workflow_dispatch' || inputs.sync != 'none'
    uses: baitimusOrga/platform/.github/workflows/env-sync.yml@65c1373a14f8f498e9848c0df72498a704ffed93 # v1
    with:
      app: hackaton
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.sync || (github.ref_type == 'tag' && 'prod' || 'staging') }}
    secrets: inherit
