<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zweit – Startseite, gescrollt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zweit/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-000:#fbfaf7;--bg-100:#edebe5;--bg-900:#1e1d1a;--ink:#1e1d1a;--ink-muted:#66625a;--ink-inverse:#fbfaf7;--line:#1e1d1a;--line-soft:#dcd9d1;--blue:#1f4fd6;--on-blue:#ffffff;--blue-text:#1a42b5;--green-text:#185e53;--focus:#1e1d1a;--danger:#a3101e;--overlay:#1e1d1ab3;--font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--radius-0:0;--radius-1:2px;--border-1:1px;--border-2:2px}
body{margin:0;background:#fbfaf7}
a{color:#1e1d1a}a:hover{color:#1a42b5}
.zw-nav a{text-decoration:none;font-size:15px;line-height:20px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 4px}
.zw-nav a:hover{text-decoration:underline;text-underline-offset:3px}
.zw-dock{flex:1 1 320px;min-width:0;display:flex;gap:8px}
@media (max-width:720px){.zw-dock{order:3;flex-basis:100%}}
</style>
</helmet>
<div class="zw" style="min-height: 100%; background: #fbfaf7; color: #1e1d1a; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="position: sticky; top: 0; background: #fbfaf7; border-bottom: 1px solid #dcd9d1;">
    <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; max-width: 1328px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 12px 24px; min-height: 72px;">
      <a href="Main.dc.html" style="display: flex; align-items: baseline; text-decoration: none; color: #1e1d1a;">
        <span style="font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -0.02em;">Zweit.</span>
      </a>
      <form class="zw-dock" action="#" role="search">
        <label for="q2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Suche</label>
        <input id="q2" class="zw-input" type="search" value="iMac 2017 5K Abholung Zürich" style="flex: 1 1 auto; min-width: 0; min-height: 44px;">
        <button type="button" class="zw-chip" aria-label="Standort ändern: 8001 Zürich, Umkreis 25 km" style="max-width: none; height: 44px;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span>25 km</span>
        </button>
        <button type="submit" class="zw-btn zw-btn--primary" aria-label="Suchen" style="min-height: 44px; padding: 0 14px;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </form>
      <nav class="zw-nav" aria-label="Hauptnavigation" style="display: flex; align-items: center; gap: 20px; margin-left: auto;">
        <a href="#" aria-label="Meine Suchen">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5;"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="#" aria-label="Nachrichten">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5;"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>
        </a>
        <a href="#" class="zw-btn" style="min-height: 44px;">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Verkaufen</span>
        </a>
        <a href="#" style="font-weight: 600;">Anmelden</a>
      </nav>
    </div>
  </header>

  <section aria-labelledby="h-near2" style="max-width: 1328px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 16px;">
    <div role="group" aria-label="Schnellfilter" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" class="zw-chip" aria-pressed="false"><span>Nur Auktionen</span></button>
      <button type="button" class="zw-chip" aria-pressed="false"><span>Unter CHF 50</span></button>
      <button type="button" class="zw-chip" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span>Abholung</span></button>
      <button type="button" class="zw-chip" aria-pressed="false"><span>Endet heute</span></button>
      <button type="button" class="zw-chip" aria-pressed="false"><span>Grüne Wahl</span></button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px;">
      <h2 id="h-near2" style="margin: 0; font-size: 24px; line-height: 28px; font-weight: 700;">Neu in deiner Nähe</h2>
      <span style="font-size: 14px; line-height: 20px; color: #66625a;">124 Inserate · zuletzt aktualisiert vor 2 Min.</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px;">
      <sc-for list="{{nearby}}" as="it" hint-placeholder-count="8">
        <a class="zw-card" href="#">
          <div class="zw-card__media"></div>
          <div class="zw-card__badges">
            <span class="zw-badge">{{it.mode}}</span>
            <sc-if value="{{it.green}}" hint-placeholder-val="{{true}}"><span class="zw-badge zw-badge--green">Grüne Wahl</span></sc-if>
          </div>
          <h3 class="zw-card__title">{{it.title}}</h3>
          <p class="zw-card__price">{{it.price}}<sc-if value="{{it.orig}}" hint-placeholder-val="{{true}}"><small>neu {{it.orig}}</small></sc-if></p>
          <p class="zw-card__meta">{{it.meta}}</p>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      nearby: [
        { title: "Dell U2720Q 27\" 4K Monitor, USB-C", mode: "Festpreis", price: "CHF 290.–", orig: "CHF 620.–", meta: "Wie neu · Zürich · Abholung", green: true },
        { title: "Kinderwagen Bugaboo Fox 3, komplett", mode: "Preisvorschlag", price: "CHF 540.–", orig: "", meta: "Sehr gut · Dübendorf · Abholung", green: false },
        { title: "Thinkpad X1 Carbon Gen 9, 16 GB, 512 GB", mode: "Festpreis", price: "CHF 680.–", orig: "CHF 1’890.–", meta: "Gut · Zürich · Abholung oder Versand", green: true },
        { title: "Esstisch Eiche massiv, 180 × 90 cm", mode: "Festpreis", price: "CHF 350.–", orig: "", meta: "Gut · Uster · Abholung, 2 Personen", green: false },
        { title: "Vitra Eames Plastic Chair, 4 Stück", mode: "Preisvorschlag", price: "CHF 480.–", orig: "", meta: "Sehr gut · Zürich · Abholung", green: false },
        { title: "Sony WH-1000XM4, mit Etui", mode: "Festpreis", price: "CHF 120.–", orig: "CHF 349.–", meta: "Gut · Kloten · Versand CHF 7.–", green: false },
        { title: "Gravel-Laufradsatz DT Swiss GR 1600", mode: "Festpreis", price: "CHF 390.–", orig: "", meta: "Wie neu · Zug · Abholung", green: true },
        { title: "Thermomix TM6, 2022", mode: "Preisvorschlag", price: "CHF 790.–", orig: "CHF 1’459.–", meta: "Sehr gut · Zürich-Altstetten · Abholung", green: false }
      ]
    };
  }
}
</script>
</body>
</html>
