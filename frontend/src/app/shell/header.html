<header>
  <div class="zw-container zw-header__bar">
    <a routerLink="/" class="zw-wordmark">
      <span class="zw-wordmark__name">Zweit.</span>
      @if (!docked()) {
        <span class="zw-wordmark__tagline">Gut, günstig, grün.</span>
      }
    </a>
    @if (docked()) {
      <form class="zw-dock" role="search" (ngSubmit)="hero.open(query())">
        <label for="header-q" class="zw-sr-only">Suche</label>
        <input
          id="header-q"
          class="zw-input"
          type="search"
          name="q"
          [ngModel]="query()"
          (ngModelChange)="query.set($event)"
        />
        <button type="button" class="zw-chip zw-chip--location" [attr.aria-label]="locationLabel">
          <app-icon name="pin" [size]="16" />
          <span>{{ location.radius }}</span>
        </button>
        <button
          appButton
          [variant]="hero.active() ? 'primary' : 'default'"
          type="submit"
          aria-label="Suchen"
        >
          <app-icon name="search" />
        </button>
      </form>
    } @else {
      <button type="button" class="zw-chip zw-chip--location" [attr.aria-label]="locationLabel">
        <app-icon name="pin" [size]="16" />
        <span>{{ location.place }} · {{ location.radius }}</span>
      </button>
    }
    <nav class="zw-nav" aria-label="Hauptnavigation">
      @if (docked()) {
        <a routerLink="/find" aria-label="Meine Suchen"><app-icon name="bookmark" /></a>
        <a routerLink="/messages" aria-label="Nachrichten"><app-icon name="message" /></a>
      } @else {
        <a routerLink="/find"><app-icon name="bookmark" />Meine Suchen</a>
        <a routerLink="/messages"><app-icon name="message" />Nachrichten</a>
      }
      <a appButton [routerLink]="[{ outlets: { modal: ['sell'] } }]"
        ><app-icon name="camera" /><span>Verkaufen</span></a
      >
      @if (auth.user()) {
        <button type="button" class="zw-link" [disabled]="signingOut()" (click)="logout()">
          Abmelden
        </button>
      } @else {
        <a routerLink="/login">Anmelden</a>
      }
    </nav>
  </div>
</header>
