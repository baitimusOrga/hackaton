@if (listing(); as item) {
  <app-listing-view [listing]="item" />

  @if (similar().length) {
    <section class="similar" aria-labelledby="h-sim">
      <app-section-heading headingId="h-sim" [heading]="'Ähnlich, in der Nähe' | t" />
      <div class="zw-grid">
        @for (other of similar(); track other.id) {
          <app-summary-card [listing]="other" />
        }
      </div>
    </section>
  }
}
