@if (config.env !== 'prod') {
  <div class="env-banner">{{ config.env }} · {{ config.release }}</div>
}
<header>
  <a routerLink="/" class="brand">hackaton</a>
  <nav>
    @if (auth.user(); as user) {
      <span class="muted">{{ user.displayName }}</span>
      <button type="button" class="link" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register" class="button">Register</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
