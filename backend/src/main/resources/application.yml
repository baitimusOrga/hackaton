# Every value can be overridden by an environment variable (Spring relaxed binding):
# app.env -> APP_ENV, spring.datasource.url -> SPRING_DATASOURCE_URL, ...
# Defaults below are for local development against docker-compose.yml.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:3000/api/auth/jwks}
  application:
    name: hackaton
  config:
    import: optional:file:.env[.properties]   # local secrets, e.g. ANTHROPIC_API_KEY=... in backend/.env (gitignored)
  datasource:
    url: jdbc:postgresql://localhost:5432/hackaton
    username: hackaton
    password: hackaton
  docker:
    compose:
      file: ../docker-compose.yml       # local only: spring-boot-docker-compose isn't in the image
      lifecycle-management: start-only  # keep Postgres running between backend restarts
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema belongs to Flyway (src/main/resources/db/migration)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  web:
    error:
      include-message: always           # error responses carry the exception message

server:
  port: 8080
  forward-headers-strategy: framework   # behind Traefik + Cloudflare

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

ai:
  api-key: ${ANTHROPIC_API_KEY:}       # empty: AI endpoints answer 503
  model: claude-sonnet-5-5
  search-model: claude-haiku-5-5
  max-tokens: 16000
  base-url: https://api.anthropic.com

geo:
  base-url: https://api3.geo.admin.ch      # swisstopo: postcode → coordinates, free, no key

app:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:4200}
  env: ${APP_ENV:dev}
  release: ${APP_RELEASE:dev}
  revision: ${APP_REVISION:}
