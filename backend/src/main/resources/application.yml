# Every value can be overridden by an environment variable (Spring relaxed binding):
# app.jwt.secret -> APP_JWT_SECRET, spring.datasource.url -> SPRING_DATASOURCE_URL, ...
# Defaults below are for local development against docker-compose.yml.
spring:
  application:
    name: hackaton
  datasource:
    url: jdbc:postgresql://localhost:5432/hackaton
    username: hackaton
    password: hackaton
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema belongs to Flyway (src/main/resources/db/migration)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  web:
    error:
      include-message: always           # the frontend shows ResponseStatusException reasons

server:
  port: 8080
  forward-headers-strategy: framework   # behind Traefik + Cloudflare

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api/docs

app:
  env: ${APP_ENV:dev}
  release: ${APP_RELEASE:dev}
  revision: ${APP_REVISION:}
  jwt:
    # >= 32 bytes. Dev default only; staging/prod get JWT_SECRET from the .env (env-sync).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    ttl: 7d
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  seed:
    demo: ${APP_SEED_DEMO:true}
    demo-password: ${APP_SEED_DEMO_PASSWORD:demo12345}
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-5-5}
