# Tests run against H2 in PostgreSQL mode, so CI needs no database container.
spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

geo:
  base-url: http://localhost:1   # refused at once: tests never reach swisstopo
